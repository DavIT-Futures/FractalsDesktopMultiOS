name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.output_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            output_name: FractalsDesktopMultiOS-windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            output_name: FractalsDesktopMultiOS-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            output_name: FractalsDesktopMultiOS-macos-arm64
            archive_ext: tar.gz
          - os: macos-13
            rid: osx-x64
            output_name: FractalsDesktopMultiOS-macos-x64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish application
        run: dotnet publish FractalsDesktopMultiOS.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o ./publish

      - name: Clean up PDBs
        shell: bash
        run: rm -f ./publish/*.pdb

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.output_name }}.zip -Force

      - name: Archive (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: tar -czvf ./${{ matrix.output_name }}.tar.gz -C ./publish .

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./${{ matrix.output_name }}.${{ matrix.archive_ext }}
